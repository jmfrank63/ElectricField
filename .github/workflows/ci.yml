name: CI

# D-11: every push to the working branch and every pull request, on all three desktop OSes.
on:
  push:
    branches: [feature/cross-platform]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false # a red macOS job must not hide the Windows/Linux result (go/no-go gate)
      matrix:
        include:
          - { name: windows-x64, os: windows-latest }
          - { name: linux-x64, os: ubuntu-latest } # Ubuntu 24.04: no apt packages needed (X11/Wayland are dlopen'ed)
          - { name: macos-arm64, os: macos-latest } # macOS 26, Apple silicon. NEVER pass -Dtarget here (native build only).
    steps:
      - uses: actions/checkout@v7

      # Third-party action: pinned to the commit of v2.2.1. Caches ~/.cache/zig (package tarballs + compiled artifacts).
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0

      - name: Zig version
        run: zig version

      # Core gate first: independent of SDL/ImGui, so a GUI-stack problem cannot mask a physics problem.
      - name: Core tests (Debug + UBSan)
        run: zig build test -Dgui=false --summary all

      - name: Core tests (ReleaseFast; catches optimisation/FMA-sensitive numerics)
        run: zig build test -Dgui=false -Doptimize=ReleaseFast --summary all

      # GUI gate.
      - name: Build everything (core lib + tests + GUI exe)
        run: zig build --summary all

      - name: Tests (default configuration)
        run: zig build test --summary all

      - name: Headless GUI start-up (SDL dummy video driver + software renderer)
        run: zig build smoke --summary all
